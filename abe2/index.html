<!doctype html>
<html>
	<head>
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
		<title></title>

		<style>
      body {
				overscroll-behavior: contain;
      }

			html, body {
				margin: 0;
				padding: 0;
				width: 100%;
				height: 100%;
				overflow: hidden;
				background: black;
			}

			canvas {
			  /* For modern browsers */
			  image-rendering: pixelated; 
			  /* For Firefox */
			  image-rendering: crisp-edges; 
			}

			.container {
			  display: flex;
			  justify-content: center;
			  align-items: center;
			  height: 100vh; /* Full viewport height */
			}
		
		</style>

	</head>
	<body>

		<div class="container">
			<canvas id="canvas"></canvas>
		</div>
		
		<script src="sprites.js"></script>
		<script src="levels.js"></script>
		<script src="arrows.js"></script>
		<script src="font.js"></script>
		<script>

var palette = [
  "#1a1c2c",
  "#5d275d",
  "#b13e53",
  "#ef7d57",
  "#ffcd75",
  "#a7f070",
  "#38b764",
  "#257179",
  "#29366f",
  "#3b5dc9",
  "#41a6f6",
  "#73eff7",
  "#f4f4f4",
  "#94b0c2",
  "#566c86",
  "#333c57",
];

function drawCanvas(ctx,cvs,x,y,s,f) {
	var hex="0123456789ABCDEF";
	for(var j=0;j<cvs.h;j++) {
		for(var i=0;i<cvs.w;i++) {
			var k=cvs.p[f][j][i];
			var c=hex.indexOf(k);
			if(c!=-1) {
				ctx.fillStyle=palette[c];
				ctx.fillRect(x+i*s,y+j*s,s,s);
			}
		}
	}
}

function drawLevel(ctx,lvl,spr,x,y,s) {
	var symbols=" @+$*.#";
	for(var j=0;j<14;j++) {
		for(var i=0;i<16;i++) {
			var k=symbols.indexOf(lvl[j][i]);
			drawCanvas(ctx,spr,i*16*s,j*16*s,s,k);
		}
	}
}

function drawText(ctx,fnt,txt,x,y,s) {
	var chars="ABCDEFGHIJKLMNOPQRSTUVWXYZ 0123456789[]";
	var a=x,b=y;
	for(var k=0;k<txt.length;k++) {
		var l=chars.indexOf(txt[k]);
		if(l!=-1) {
			drawCanvas(ctx,fnt,a,b,s,l);
			a+=(fnt.w+1)*s;
			if(a+(fnt.w+1)*s>=canvas.width) {
				a=0;
				b+=(fnt.h+1)*s;
			}
		}		
	}
}

// Disables right-click context menu on the entire website
window.addEventListener('contextmenu', (event) => {
  event.preventDefault();
});

var canvas=document.getElementById("canvas");
var ctx=canvas.getContext("2d");

canvas.width = 256;
canvas.height = 384;
canvas.style.border = "1px solid white";

ctx.fillStyle=palette[0];
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.beginPath();
ctx.strokeStyle="#FFFFFF";
ctx.rect(0.5,0.5,256,256);
ctx.stroke();
ctx.closePath();

drawLevel(ctx,levels[0],sprites,0,0,1);

drawCanvas(ctx,arrows, 16*2,256,2,0);
drawCanvas(ctx,arrows, 16*2*2,256+16*2,2,1);
drawCanvas(ctx,arrows, 16*2,256+16*2*2,2,2);
drawCanvas(ctx,arrows, 0,256+16*2,2,3);

drawText(ctx,font,"HELLO WORLD [14344]",4,16*14+4,2);

		</script>
	</body>
</html>
