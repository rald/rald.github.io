<!doctype html>
<html>
	<head>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title></title>

		<style>

			.container {
			  display: flex;
			  justify-content: center;
			  align-items: center;
			  height: 100vh; /* Full viewport height */
			}
		
		</style>

	</head>
	<body>

		<div class="container">
			<canvas id="canvas"></canvas>
		</div>
		
		<script src="sprites.js"></script>
		<script src="levels.js"></script>
		<script src="arrows.js"></script>
		<script>

var palette = [
  "#1a1c2c",
  "#5d275d",
  "#b13e53",
  "#ef7d57",
  "#ffcd75",
  "#a7f070",
  "#38b764",
  "#257179",
  "#29366f",
  "#3b5dc9",
  "#41a6f6",
  "#73eff7",
  "#f4f4f4",
  "#94b0c2",
  "#566c86",
  "#333c57",
];

function drawCanvas(ctx,cvs,x,y,s,f) {
	var hex="0123456789ABCDEF";
	for(var j=0;j<cvs.h;j++) {
		for(var i=0;i<cvs.w;i++) {
			var k=cvs.p[f][j][i];
			var c=hex.indexOf(k);
			if(c!=-1) {
				ctx.fillStyle=palette[c];
				ctx.fillRect(x+i*s,y+j*s,s,s);
			}
		}
	}
}

function drawLevel(ctx,lvl,spr,x,y,s) {
	var symbols=" @+$*.#";
	for(var j=0;j<14;j++) {
		for(var i=0;i<16;i++) {
			var k=symbols.indexOf(lvl[j][i]);
			drawCanvas(ctx,spr,i*16,j*16,s,k);
		}
	}
}

var canvas=document.getElementById("canvas");
var ctx=canvas.getContext("2d");

canvas.width = 256;
canvas.height = 512;

ctx.fillStyle=palette[0];
ctx.fillRect(0,0,canvas.width,canvas.height);

drawLevel(ctx,levels[0],sprites,0,0,1);


drawCanvas(ctx,arrows, 96,384,4,0);
drawCanvas(ctx,arrows,160,448,4,1);
drawCanvas(ctx,arrows, 96,448,4,2);
drawCanvas(ctx,arrows, 32,448,4,3);

		</script>
	</body>
</html>
